name: Generate plots

# Re-solves every problem and commits the plots and results table.
on:
  push:
    paths:
      - vibrations.py
      - .github/workflows/plots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python vibrations.py
      - name: Commit plots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plots/*.png results.md
          git diff --cached --quiet || git commit -m "Regenerate result plots"
          git push
